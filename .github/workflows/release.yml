name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.0). Leave blank to use package.json version.'
        required: false

jobs:
  # -----------------------------------------------------------------------
  # Gate: full test + typecheck before releasing
  # -----------------------------------------------------------------------
  test:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # -----------------------------------------------------------------------
  # Release: tag, GitHub Release, npm publish
  # -----------------------------------------------------------------------
  release:
    name: Publish release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          # setup-node handles writing .npmrc with NODE_AUTH_TOKEN for us
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ── Resolve tag ───────────────────────────────────────────────────
      - name: Resolve tag name
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              echo "name=$INPUT_TAG" >> $GITHUB_OUTPUT
            else
              VERSION=$(node -p "require('./package.json').version")
              echo "name=v$VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      # ── Create git tag (workflow_dispatch only) ───────────────────────
      - name: Create git tag if needed
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Skipping creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # ── Extract changelog section for this version ────────────────────
      - name: Extract changelog
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ── Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false

      # ── Publish to npm ────────────────────────────────────────────────
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not configured. Skipping npm publish."
            exit 0
          fi
          npm publish --access public

      # ── Create reminder issue if publish fails ────────────────────────
      - name: Create token reminder issue on publish failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "npm-token" --state open --json number --jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create \
              --title "Update npm automation token" \
              --label "npm-token" \
              --body "npm publish failed on $(date -u +'%Y-%m-%d'). Regenerate the token at https://www.npmjs.com/settings/tokens and update the \`NPM_TOKEN\` GitHub secret. npm automation tokens expire after 90 days."
          else
            echo "A reminder issue already exists; skipping."
          fi
